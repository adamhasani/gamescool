    try { tall = matchMedia('(max-aspect-ratio: 1/1)').matches; } catch (e) { /* keep wide (the title screen's own switch) */ }
    var list = C.art.map(function (a) { return tall && a.tall ? a.tall : a.src; });
    if (ctx.kind === 'tour' && D.chapters[ctx.ev.chapter]) {
      var own = D.chapters[ctx.ev.chapter].art;
      list = [own].concat(list.filter(function (s) { return s !== own; }));
    }
    if (framed && ctx.kind !== 'tour' && ctx.track === D.def) {
      try {
        var host = window.parent.document.querySelector('.g23-poster img');
        if (host && host.currentSrc) list[0] = host.currentSrc;
      } catch (e) { /* not our page */ }
    }
    slides = list;
  }
  var stage = $('.ld-slides'), shown = [], at = -1, SLIDE_MS = 7000;
  function makeSlide(n, firstOne) {
    var wrap = doc.createElement('div'), img = doc.createElement('img');
    wrap.className = 'ld-slide' + (firstOne ? ' first' : n % 2 ? ' b' : ' a');
    img.alt = ''; img.decoding = 'async';
    try { img.fetchPriority = n ? 'low' : 'high'; } catch (e) { /* older engines */ }
    img.src = slides[n];
    wrap.appendChild(img);
    stage.appendChild(wrap);
    return { el: wrap, img: img, ok: img.decode ? img.decode().then(function () { return true; }, function () { return false; }) : Promise.resolve(true) };
  }
  function show(s) {
    s.el.classList.add('on');
    shown.push(s);
    if (shown.length > 2) { var old = shown.shift(); later(function () { if (old.el.parentNode) old.el.parentNode.removeChild(old.el); }, 50); }
  }
  function next() {
    if (over || slides.length < 2 || reduced) return;
    var n = (at + 1) % slides.length, s = makeSlide(n);
    later(function () { s.ok.then(function (ok) { if (over) return; if (ok) { at = n; show(s); } else if (s.el.parentNode) s.el.parentNode.removeChild(s.el); later(next, SLIDE_MS - 2500); }); }, 2500);
  }
  var first = slides.length ? makeSlide(0, true) : null;
  if (first) { at = 0; show(first); later(next, SLIDE_MS - 2500); }

  // ---- the card: what is loading, its route from the start gate, the stats
  var head = $('.ld-head'), glow = $('.ld-glow'), run = $('.ld-run'), pts = null, N = 0;
  if (C) {
    var card = $('.ld-card'), stats = [], kick, name;
    var startCp = 0, laps = D.laps, field = D.racers;
    if (ctx.kind === 'tour') {
      var ev = ctx.ev, leg = ev.legs ? ev.legs[Math.min(ctx.leg, ev.legs.length - 1)] : null;
      startCp = leg ? leg.startCp : ev.startCp; laps = leg ? leg.laps : ev.laps; field = ev.field;
      kick = 'Jakarta Tour · ' + (D.chapters[ev.chapter] ? D.chapters[ev.chapter].name : 'Chapter ' + ev.chapter);
      name = ev.name;
      stats.push({ t: ev.type, c: ev.color });
      if (leg) stats.push({ t: 'Leg ' + (Math.min(ctx.leg, ev.legs.length - 1) + 1) + ' of ' + ev.legs.length });
    } else {
      kick = ctx.kind === 'quick' ? 'Quick race' : 'Circuit';
      name = C.name;
    }
    if (laps) stats.push({ t: laps + (laps === 1 ? ' lap' : ' laps') + ' · ' + C.km + ' km' });
    else stats.push({ t: C.km + ' km lap' });
    stats.push({ t: field + (field === 1 ? ' drone' : ' drones') });
    stats.push({ t: C.time });
    var dr = D.drones[ctx.drone];
    if (dr && ctx.kind !== 'boot') stats.push({ t: dr.name, c: dr.accent });
    $('.ld-kick').textContent = kick;
    $('.ld-name').textContent = name;
    var row = $('.ld-stats');
    stats.forEach(function (s) {
      var sp = doc.createElement('span');
      sp.textContent = s.t;
      if (s.c) { sp.className = 'chip'; sp.style.setProperty('--c', s.c); }
      row.appendChild(sp);
    });
    // the lap from the start gate: rotate the outline so it starts there
    var raw = C.pts; N = raw.length / 2;
    var off = Math.round((startCp / D.checkpoints) * N) % N;
    pts = new Array(N * 2);
    for (var j = 0; j < N; j++) { pts[j * 2] = raw[((j + off) % N) * 2]; pts[j * 2 + 1] = raw[((j + off) % N) * 2 + 1]; }
    var d = '';
    for (var k2 = 0; k2 < N; k2++) d += (k2 ? 'L' : 'M') + pts[k2 * 2] + ' ' + pts[k2 * 2 + 1];
    d += 'L' + pts[0] + ' ' + pts[1];
    ['.ld-under', '.ld-base', '.ld-run'].forEach(function (s) { $(s).setAttribute('d', d); });
    var gates = $('.ld-gates');
    for (var g = 1; g < D.checkpoints; g++) {
      var gi = Math.round((g / D.checkpoints) * N) % N;
      gates.appendChild(svgEl('circle', { cx: pts[gi * 2], cy: pts[gi * 2 + 1], r: 3.4 }));
    }
    var a = Math.atan2(pts[5] - pts[1], pts[4] - pts[0]) * 180 / Math.PI;
    $('.ld-start').setAttribute('transform', 'translate(' + pts[0] + ' ' + pts[1] + ') rotate(' + a.toFixed(1) + ')');
    card.hidden = false;
  }

  // ---- tips, one at a time
  var tipEl = $('.ld-tip span'), tips = D ? D.tips.map(function (t) { return touch ? t.touch : t.keys; }) : [], tipAt = 0;
  if (tips.length) {
    tipAt = Math.floor(Math.random() * tips.length);
    tipEl.textContent = tips[tipAt];
    $('.ld-tip').classList.add('on');
    var rotate = function () {
      if (over) return;
      $('.ld-tip').classList.remove('on');
      later(function () { tipAt = (tipAt + 1) % tips.length; tipEl.textContent = tips[tipAt]; $('.ld-tip').classList.add('on'); later(rotate, 5600); }, 320);
    };
    later(rotate, 5600);
  }

  // ---- progress: never down; the shown value eases after the asked one so the route fills smoothly
  var want = 0, now = 0, lastT = 0, pill = $('.ld-pill'), pct = $('.ld-pct'), raf = 0;
  function place(p) {
    if (run) run.style.strokeDasharray = p.toFixed(4) + ' 1';
    if (pts && head) {
      var f = Math.min(p, 0.9999) * N, i0 = Math.floor(f), i1 = (i0 + 1) % N, t = f - i0;
      var x = pts[i0 * 2] + (pts[i1 * 2] - pts[i0 * 2]) * t, y = pts[i0 * 2 + 1] + (pts[i1 * 2 + 1] - pts[i0 * 2 + 1]) * t;
      head.setAttribute('cx', x.toFixed(1)); head.setAttribute('cy', y.toFixed(1));
      glow.setAttribute('cx', x.toFixed(1)); glow.setAttribute('cy', y.toFixed(1));
    }
    if (want > 0) { pct.textContent = Math.floor(p * 100) + '%'; pill.setAttribute('aria-valuenow', String(Math.floor(p * 100))); }
  }
  function tick(t) {
    raf = 0;
    if (over) return;
    var dt = lastT ? Math.min(0.1, (t - lastT) / 1000) : 0.016;
    lastT = t;
    now += (want - now) * (reduced ? 1 : 1 - Math.exp(-dt / 0.22));
    if (want - now < 0.0005) now = want;
    place(now);
    if (now < want) raf = requestAnimationFrame(tick); else lastT = 0;
  }
  place(0);
  window.__g23loader = {
    progress: function (p) {
      p = +p;
      if (!(p > want) || over) return;
      want = Math.min(1, p);
      if (!raf) raf = requestAnimationFrame(tick);
    },
  };

  // ---- painted: tell a framing page of our own origin (it can show this frame now instead of its still poster)
  var told = false;
  function painted() {
    if (told || over) return;
    told = true;
    body.dataset.loader = '1';
    if (framed) { try { window.parent.postMessage({ g23: 'loader' }, location.origin); } catch (e) { /* gone */ } }
  }
  var fontsIn = doc.fonts && doc.fonts.load ? doc.fonts.load('800 100px "Barlow Condensed"').then(function () { return true; }, function () { return true; }) : Promise.resolve(true);
  Promise.all([first ? first.ok : Promise.resolve(true), fontsIn]).then(painted);
  later(painted, 2500);

  // ---- the end: the first frame fades this out (style.css); a boot that failed shows its note instead of the pill
  function stop() {
    if (over) return;
    over = true;
    timers.forEach(clearTimeout);
    if (raf) cancelAnimationFrame(raf);
    place(1);
    setTimeout(function () { while (stage.firstChild) stage.removeChild(stage.firstChild); }, 900);
  }
  var note = $('.poster-note');
  function watch() {
    if (body.dataset.ready === '1') { want = 1; stop(); return; }
    if (body.dataset.error || (note && !note.hidden && note.textContent)) { root.classList.add('ld-failed'); over = true; timers.forEach(clearTimeout); }
  }
  try {
    var mo = new MutationObserver(watch);
    mo.observe(body, { attributes: true, attributeFilter: ['data-ready', 'data-error'] });
    if (note) mo.observe(note, { attributes: true, attributeFilter: ['hidden'], childList: true, characterData: true, subtree: true });
  } catch (e) { /* the fade still works from CSS */ }
})();
</script>
